name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets

      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  packaging-and-scripts:
    name: Shell Scripts, Admin Suite & Packaging Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell script syntax (bash -n)
        run: |
          bash -n start.sh demo-stagenet.sh admin.sh \
            admin/*.sh admin/lib/*.sh admin/i18n/*.sh \
            scripts/install.sh deploy/packaging/xmr-gateway-admin \
            deploy/packaging/deb/* deploy/packaging/rpm/*

      - name: Run isolated admin panel test suite
        run: ./admin/test_admin.sh

      - name: Validate installer dry-run across methods
        run: |
          ./scripts/install.sh --dry-run --method deb --version v0.1.3
          ./scripts/install.sh --dry-run --method rpm --version v0.1.3
          ./scripts/install.sh --dry-run --method tarball --version v0.1.3

      - name: Validate workflow and Compose YAML syntax
        run: |
          python3 -c '
          import yaml
          for p in [
              ".github/workflows/ci.yml",
              ".github/workflows/security.yml",
              ".github/workflows/release.yml",
              "deploy/docker/docker-compose.yml",
          ]:
              with open(p, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"YAML OK: {p}")
          '
