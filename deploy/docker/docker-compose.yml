# ==============================================================================
# xmr-gateway Production Docker / Podman Compose Stack
# ==============================================================================
# Usage (prebuilt GHCR multi-arch images — recommended):
#   cp deploy/docker/.env.docker.example deploy/docker/.env.docker
#   chmod 600 deploy/docker/.env.docker
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env.docker pull
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env.docker up -d
#
# Or build locally from source:
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env.docker up -d --build
#
# Optional automatic HTTPS via Caddy:
#   docker compose -f deploy/docker/docker-compose.yml --env-file deploy/docker/.env.docker --profile caddy up -d
# ==============================================================================

services:
  monero-wallet-rpc:
    image: ${XMR_WALLET_RPC_IMAGE:-ghcr.io/xeonit-dev/xmr-gateway-wallet-rpc:v0.1.5}
    build:
      context: ../..
      dockerfile: deploy/docker/Containerfile.monero-rpc
    container_name: xmr-gateway-wallet-rpc
    env_file:
      - ${ENV_FILE:-.env.docker}
    # Port 18082 is NEVER published to the host — reachable only over xmr_internal.
    volumes:
      - ${WALLET_HOST_DIR:-../../data/wallet}:/wallet:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - xmr_internal
      - xmr_egress

  xmr-gateway:
    image: ${XMR_GATEWAY_IMAGE:-ghcr.io/xeonit-dev/xmr-gateway:v0.1.5}
    build:
      context: ../..
      dockerfile: Containerfile
    container_name: xmr-gateway
    depends_on:
      - monero-wallet-rpc
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATABASE_URL: "sqlite:///data/xmr_gateway.db"
      MONERO_RPC_URL: "http://monero-wallet-rpc:18082/json_rpc"
    # Bind strictly to host loopback; terminate TLS via Caddy/Nginx.
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    # Isolated gateway data dir ONLY (sibling of WALLET_HOST_DIR — never exposes wallet keys!)
    volumes:
      - ${DATA_HOST_DIR:-../../data/gateway}:/data:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped
    networks:
      - xmr_internal
      - xmr_egress

  caddy:
    image: caddy:2.8-alpine
    container_name: xmr-gateway-caddy
    profiles:
      - caddy
    depends_on:
      - xmr-gateway
    environment:
      XMR_GATEWAY_DOMAIN: "${XMR_GATEWAY_DOMAIN:-pay.example.com}"
      XMR_GATEWAY_UPSTREAM: "xmr-gateway:8080"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - xmr_egress

networks:
  # Isolated container-to-container RPC plane (no external routing)
  xmr_internal:
    internal: true
  # Outbound-capable plane for remote Monero node & merchant webhooks
  xmr_egress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
