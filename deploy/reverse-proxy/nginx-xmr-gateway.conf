# ==============================================================================
# xmr-gateway Production Reverse Proxy — Nginx (TLS 1.2/1.3)
# ==============================================================================
# Install to /etc/nginx/sites-available/xmr-gateway.conf (Debian/Ubuntu) or
# /etc/nginx/conf.d/xmr-gateway.conf (Fedora/RHEL), replace `pay.example.com`
# and TLS certificate paths (e.g., via Certbot), then reload Nginx.
# ==============================================================================

upstream xmr_gateway_backend {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name pay.example.com;

    # Allow ACME HTTP-01 challenge while redirecting all other traffic to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pay.example.com;

    ssl_certificate     /etc/letsencrypt/live/pay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:XMR_TLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    # Defense-in-depth example: restrict operator-only sweep and webhook retry routes
    # to loopback / operator VPN CIDR (in addition to OPERATOR_API_KEY RBAC in xmr-gateway).
    location ~ ^/api/v1/(invoices/[^/]+/(sweep(/resolve)?|webhooks/retry)|webhooks/[^/]+/retry)$ {
        # Uncomment to enforce IP/VPN allowlist:
        # allow 127.0.0.1;
        # allow ::1;
        # allow 10.10.0.0/24;
        # deny all;

        proxy_pass http://xmr_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;
    }

    location / {
        proxy_pass http://xmr_gateway_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    35s;
        proxy_read_timeout    35s;
    }
}
