[package]
name = "xmr-gateway"
version = "0.1.4"
edition = "2024"
rust-version = "1.94"
authors = ["xmr-gateway contributors"]
description = "Production-grade, non-custodial Monero (XMR) payment gateway and auto-sweep engine"
license = "MIT"
readme = "README.md"
keywords = ["monero", "xmr", "payment-gateway", "cryptocurrency", "non-custodial"]
categories = ["cryptography::cryptocurrencies", "web-programming::http-server"]

[lib]
name = "xmr_gateway"
path = "src/lib.rs"

[[bin]]
name = "xmr-gateway"
path = "src/main.rs"

[dependencies]
# Web framework & async runtime
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "timeout", "request-id", "sensitive-headers"] }

# Persistence (SQLite WAL mode)
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client & RFC 2617/7616 Digest auth for monero-wallet-rpc
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
digest_auth = "0.3"
url = "2.5"

# Cryptography & constant-time authentication
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2.6"

# QR code generation (PNG -> Base64)
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

# Observability, errors & utilities
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
http-body-util = "0.1"
tempfile = "3.19"

# ==============================================================================
# Debian Package Metadata (cargo-deb)
# ==============================================================================
[package.metadata.deb]
maintainer = "xmr-gateway maintainers <security@xmr-gateway.local>"
copyright = "2026, xmr-gateway contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
Self-hosted, non-custodial Monero (XMR) payment gateway and auto-sweep engine
with per-invoice subaddress isolation, SQLite WAL durability, HMAC-SHA256 webhooks,
RBAC operator separation, and the unified xmr-gateway-admin CLI suite."""
section = "net"
priority = "optional"
depends = "$auto, ca-certificates, curl, python3, openssl"
recommends = "sqlite3"
maintainer-scripts = "deploy/packaging/deb"
assets = [
    ["target/release/xmr-gateway", "usr/bin/xmr-gateway", "755"],
    ["deploy/packaging/xmr-gateway-admin", "usr/bin/xmr-gateway-admin", "755"],
    ["admin.sh", "usr/share/xmr-gateway/admin.sh", "755"],
    ["start.sh", "usr/share/xmr-gateway/start.sh", "755"],
    ["admin/service.sh", "usr/share/xmr-gateway/admin/service.sh", "755"],
    ["admin/config.sh", "usr/share/xmr-gateway/admin/config.sh", "755"],
    ["admin/wallet.sh", "usr/share/xmr-gateway/admin/wallet.sh", "755"],
    ["admin/invoices.sh", "usr/share/xmr-gateway/admin/invoices.sh", "755"],
    ["admin/webhooks.sh", "usr/share/xmr-gateway/admin/webhooks.sh", "755"],
    ["admin/db.sh", "usr/share/xmr-gateway/admin/db.sh", "755"],
    ["admin/dev.sh", "usr/share/xmr-gateway/admin/dev.sh", "755"],
    ["admin/lib/common.sh", "usr/share/xmr-gateway/admin/lib/common.sh", "644"],
    ["admin/lib/i18n.sh", "usr/share/xmr-gateway/admin/lib/i18n.sh", "644"],
    ["admin/i18n/en.sh", "usr/share/xmr-gateway/admin/i18n/en.sh", "644"],
    ["admin/i18n/ru.sh", "usr/share/xmr-gateway/admin/i18n/ru.sh", "644"],
    ["admin/GUIDE_EN.md", "usr/share/xmr-gateway/admin/GUIDE_EN.md", "644"],
    ["admin/GUIDE_RU.md", "usr/share/xmr-gateway/admin/GUIDE_RU.md", "644"],
    ["deploy/reverse-proxy/Caddyfile", "usr/share/xmr-gateway/reverse-proxy/Caddyfile", "644"],
    ["deploy/reverse-proxy/nginx-xmr-gateway.conf", "usr/share/xmr-gateway/reverse-proxy/nginx-xmr-gateway.conf", "644"],
    ["deploy/podman/quadlet/xmr-gateway-internal.network", "usr/share/xmr-gateway/podman/quadlet/xmr-gateway-internal.network", "644"],
    ["deploy/podman/quadlet/xmr-gateway-egress.network", "usr/share/xmr-gateway/podman/quadlet/xmr-gateway-egress.network", "644"],
    ["deploy/podman/quadlet/monero-wallet-rpc.container", "usr/share/xmr-gateway/podman/quadlet/monero-wallet-rpc.container", "644"],
    ["deploy/podman/quadlet/xmr-gateway.container", "usr/share/xmr-gateway/podman/quadlet/xmr-gateway.container", "644"],
    ["CHANGELOG.md", "usr/share/doc/xmr-gateway/CHANGELOG.md", "644"],
    ["README.md", "usr/share/doc/xmr-gateway/README.md", "644"],
    ["README_RU.md", "usr/share/doc/xmr-gateway/README_RU.md", "644"],
    ["DEPLOY_EN.md", "usr/share/doc/xmr-gateway/DEPLOY_EN.md", "644"],
    ["DEPLOY_RU.md", "usr/share/doc/xmr-gateway/DEPLOY_RU.md", "644"],
    ["LICENSE", "usr/share/doc/xmr-gateway/LICENSE", "644"],
    [".env.example", "etc/xmr-gateway/env.example", "640"],
    ["deploy/systemd/render-wallet-rpc-conf.sh", "usr/share/xmr-gateway/scripts/render-wallet-rpc-conf.sh", "755"],
    ["deploy/systemd/xmr-gateway.service", "usr/lib/systemd/system/xmr-gateway.service", "644"],
    ["deploy/systemd/monero-wallet-rpc.service", "usr/lib/systemd/system/monero-wallet-rpc.service", "644"],
    ["deploy/systemd/xmr-gateway-backup.service", "usr/lib/systemd/system/xmr-gateway-backup.service", "644"],
    ["deploy/systemd/xmr-gateway-backup.timer", "usr/lib/systemd/system/xmr-gateway-backup.timer", "644"],
]

# ==============================================================================
# RPM Package Metadata (cargo-generate-rpm)
# ==============================================================================
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/xmr-gateway", dest = "/usr/bin/xmr-gateway", mode = "0755" },
    { source = "deploy/packaging/xmr-gateway-admin", dest = "/usr/bin/xmr-gateway-admin", mode = "0755" },
    { source = "admin.sh", dest = "/usr/share/xmr-gateway/admin.sh", mode = "0755" },
