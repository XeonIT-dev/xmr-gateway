    { source = "admin/webhooks.sh", dest = "/usr/share/xmr-gateway/admin/webhooks.sh", mode = "0755" },
    { source = "admin/db.sh", dest = "/usr/share/xmr-gateway/admin/db.sh", mode = "0755" },
    { source = "admin/dev.sh", dest = "/usr/share/xmr-gateway/admin/dev.sh", mode = "0755" },
    { source = "admin/lib/common.sh", dest = "/usr/share/xmr-gateway/admin/lib/common.sh", mode = "0644" },
    { source = "admin/lib/i18n.sh", dest = "/usr/share/xmr-gateway/admin/lib/i18n.sh", mode = "0644" },
    { source = "admin/i18n/en.sh", dest = "/usr/share/xmr-gateway/admin/i18n/en.sh", mode = "0644" },
    { source = "admin/i18n/ru.sh", dest = "/usr/share/xmr-gateway/admin/i18n/ru.sh", mode = "0644" },
    { source = "admin/GUIDE_EN.md", dest = "/usr/share/xmr-gateway/admin/GUIDE_EN.md", mode = "0644" },
    { source = "admin/GUIDE_RU.md", dest = "/usr/share/xmr-gateway/admin/GUIDE_RU.md", mode = "0644" },
    { source = "deploy/reverse-proxy/Caddyfile", dest = "/usr/share/xmr-gateway/reverse-proxy/Caddyfile", mode = "0644" },
    { source = "deploy/reverse-proxy/nginx-xmr-gateway.conf", dest = "/usr/share/xmr-gateway/reverse-proxy/nginx-xmr-gateway.conf", mode = "0644" },
