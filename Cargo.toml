    { source = "deploy/podman/quadlet/xmr-gateway.container", dest = "/usr/share/xmr-gateway/podman/quadlet/xmr-gateway.container", mode = "0644" },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/xmr-gateway/CHANGELOG.md", mode = "0644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/xmr-gateway/README.md", mode = "0644", doc = true },
    { source = "README_RU.md", dest = "/usr/share/doc/xmr-gateway/README_RU.md", mode = "0644", doc = true },
    { source = "DEPLOY_EN.md", dest = "/usr/share/doc/xmr-gateway/DEPLOY_EN.md", mode = "0644", doc = true },
    { source = "DEPLOY_RU.md", dest = "/usr/share/doc/xmr-gateway/DEPLOY_RU.md", mode = "0644", doc = true },
    { source = "LICENSE", dest = "/usr/share/doc/xmr-gateway/LICENSE", mode = "0644", doc = true },
    { source = ".env.example", dest = "/etc/xmr-gateway/env.example", mode = "0640", config = true },
    { source = "deploy/systemd/render-wallet-rpc-conf.sh", dest = "/usr/share/xmr-gateway/scripts/render-wallet-rpc-conf.sh", mode = "0755" },
    { source = "deploy/systemd/xmr-gateway.service", dest = "/usr/lib/systemd/system/xmr-gateway.service", mode = "0644" },
    { source = "deploy/systemd/monero-wallet-rpc.service", dest = "/usr/lib/systemd/system/monero-wallet-rpc.service", mode = "0644" },
